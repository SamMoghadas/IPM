spring:
  application:
    name: saman
  main:
    # Required so Swing UI can open windows
    headless: false
  datasource:
    # Override with env DB_PATH when deploying (e.g. /var/saman/CarRental.db)
    url: jdbc:sqlite:${DB_PATH:CarRental.db}
    driver-class-name: org.sqlite.JDBC
  jdbc:
    template:
      query-timeout: 30

# Fingerprint device — same LAN as this process today; on server set FINGERPRINT_HOST.
fingerprint:
  host: ${FINGERPRINT_HOST:192.168.1.200}
  port: ${FINGERPRINT_PORT:4370}
  mock: ${FINGERPRINT_MOCK:false}
  connect-timeout-ms: ${FINGERPRINT_CONNECT_TIMEOUT_MS:8000}
  verify-timeout-seconds: ${FINGERPRINT_VERIFY_TIMEOUT_SECONDS:40}

logging:
  level:
    root: INFO
    com.car.rental: INFO
