spring:
  application:
    name: saman
  main:
    # Required so Swing UI can open windows
    headless: false
  datasource:
    # Local SQLite file next to the working directory
    url: jdbc:sqlite:CarRental.db
    driver-class-name: org.sqlite.JDBC
  # SQLite does not need a real pool size; keep it small
  jdbc:
    template:
      query-timeout: 30

# Fingerprint device — works when device is on the same LAN as this machine.
# Later on the real server, only change host/port here (or env vars).
fingerprint:
  host: 192.168.1.200
  port: 4370
  # set true to run UI without a physical device
  mock: false
  connect-timeout-ms: 8000

logging:
  level:
    root: INFO
    com.car.rental: INFO
